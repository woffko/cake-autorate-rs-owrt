[package]
name = "cake-autorate-rs"
version = "1.0.0-rc.27"
edition = "2021"
license = "GPL-2.0-or-later"

[features]
default = ["calibration"]
calibration = ["dep:ring", "transport-probes"]
transport-probes = [
    "dep:rustls",
    "dep:socket2",
    "dep:tungstenite",
    "dep:webpki-roots",
]

[dependencies]
libc = "0.2"
ring = { version = "0.17.14", optional = true }
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std", "tls12"], optional = true }
socket2 = { version = "0.6.4", features = ["all"], optional = true }
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"], optional = true }
webpki-roots = { version = "0.26.11", optional = true }

[[bin]]
name = "cake-autorated"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
