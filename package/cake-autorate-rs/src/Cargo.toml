[package]
name = "cake-autorate-rs"
version = "1.0.0-rc.27"
edition = "2021"
license = "GPL-2.0-or-later"

[features]
default = ["calibration"]
calibration = ["dep:ring", "transport-probes"]
transport-probes = [
    "dep:rustls",
    "dep:socket2",
    "dep:tungstenite",
    "dep:webpki-roots",
]

[dependencies]
libc = "0.2"
ring = { version = "0.17.14", optional = true }
serde_json = { version = "1.0.151" }
sha2 = { version = "0.10.9", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
socket2 = { version = "0.6.4", features = ["all"], optional = true }
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"], optional = true }
webpki-roots = { version = "0.26.11", optional = true }

[dev-dependencies]
# Test-only: certificates for the in-process TLS broker of the MQTT publisher tests.
rcgen = "0.13"

[[bin]]
name = "cake-autorated"
path = "src/main.rs"

[lints.clippy]
# Every unsafe block says why it is sound. The source gate turns this into an
# error for the daemon and its tests, in both the Full and the Lite build.
undocumented_unsafe_blocks = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# Integer overflow panics instead of wrapping. The OpenWrt SDK sets the same for
# every Rust package; keeping it here makes builds outside the SDK match.
overflow-checks = true
